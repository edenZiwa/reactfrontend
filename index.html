<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garden of Mercy Foundation | Sowing Seeds of Mercy</title>
    <meta name="description" content="Garden of Mercy Foundation sows seeds of mercy and compassion by supporting children, helping vulnerable people, and transforming communities through humanitarian action.">
    <meta name="author" content="Garden of Mercy Foundation">
    <meta name="robots" content="index, follow, max-image-preview:large">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <link rel="canonical" href="https://gardenofmercy.org/">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <meta name="theme-color" content="#176b45">
    <meta name="color-scheme" content="light dark">
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("gomf-theme");
          var mode = ["light", "dark", "system"].includes(saved) ? saved : "system";
          var dark = mode === "dark" || (mode === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.setAttribute("data-bs-theme", dark ? "dark" : "light");
        } catch (_) {
          document.documentElement.setAttribute("data-bs-theme", "light");
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/icons/icon-192.svg">
    <link rel="apple-touch-icon" href="/images/garden_of_mercy_icon.png">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Garden of Mercy Foundation">
    <meta property="og:title" content="Garden of Mercy Foundation | Sowing Seeds of Mercy">
    <meta property="og:description" content="We believe that children deserve dignity, care, opportunity and an environment where they can grow with hope for the future. Our work is centered on identifying meaningful needs and responding through responsible, compassionate action.">
    <meta property="og:url" content="https://gardenofmercy.org/">
    <meta property="og:image" content="https://gardenofmercy.org/images/garden-of-mercy-social.jpg">
    <meta property="og:image:alt" content="Garden of Mercy Foundation humanitarian work">
    <meta property="og:locale" content="en_UG">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Garden of Mercy Foundation">
    <meta name="twitter:description" content="Sowing seeds of mercy and compassion. Restoring hope. Transforming lives.">
    <meta name="twitter:image" content="https://gardenofmercy.org/images/garden-of-mercy-social.jpg">
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Garden of Mercy">
    <style>
      #gom-launch-screen {
        position: fixed; inset: 0; z-index: 2147483000;
        display: grid; place-items: center; padding: 2rem;
        background:
          linear-gradient(145deg, rgba(255,255,255,.94), rgba(244,250,245,.88)),
          url("/images/garden-of-mercy-social.jpg") center / cover no-repeat;
        opacity: 1; visibility: visible;
        transition: opacity .45s ease, visibility .45s ease;
      }
      #gom-launch-screen.is-leaving { opacity: 0; visibility: hidden; pointer-events: none; }
      #gom-launch-screen .gom-launch-card {
        width: min(100%, 28rem); text-align: center; padding: 2.5rem 1.5rem;
        border-radius: 2rem; background: rgba(255,255,255,.82);
        box-shadow: 0 1rem 3rem rgba(23,107,69,.12);
        backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      }
      #gom-launch-screen img { width: clamp(6rem, 28vw, 9rem); height: auto; object-fit: contain; }
      #gom-launch-screen h1 { margin: 1rem 0 .35rem; color: #176b45; font: 800 clamp(1.5rem, 5vw, 2rem)/1.15 Lato, sans-serif; }
      #gom-launch-screen p { margin: 0; color: #466653; font: 600 1rem/1.5 Lato, sans-serif; }
      #gom-launch-screen .gom-launch-loader { width: 2rem; height: 2rem; margin: 1.75rem auto 0; border: 3px solid #dcebe1; border-top-color: #176b45; border-radius: 50%; animation: gom-spin .8s linear infinite; }
      @keyframes gom-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        #gom-launch-screen, #gom-launch-screen .gom-launch-loader { transition: none; animation: none; }
      }
      @media (display-mode: standalone) { body { background: #fff; } }
    </style>
</head>
<body>
    <div id="root"></div>
    <div id="gom-launch-screen" role="status" aria-live="polite" aria-label="Opening Garden of Mercy Foundation">
      <div class="gom-launch-card">
        <img src="/images/garden_of_mercy_icon.png" alt="" width="144" height="144" fetchpriority="high">
        <h1>Garden of Mercy Foundation</h1>
        <p>Sowing Seeds of Mercy and Compassion</p>
        <div class="gom-launch-loader" aria-hidden="true"></div>
      </div>
    </div>
    <script>
      // Safety fallback: never leave the launch overlay covering a failed app.
      window.setTimeout(function () {
        document.getElementById("gom-launch-screen")?.classList.add("is-leaving");
      }, 10000);
    </script>
    <script type="module" src="/src/App.jsx"></script>
</body>
</html>
