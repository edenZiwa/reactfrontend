name: Refresh frontend dependency lockfile

on:
  push:
    branches:
      - security/frontend-lockfile-audit
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: frontend-lockfile-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate reproducible npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already current"
          else
            git commit -m "build: add reproducible frontend dependency lockfile"
            git push origin HEAD:${{ github.ref_name }}
          fi
