name: Apply non-breaking frontend dependency fixes

on:
  push:
    branches:
      - security/frontend-lockfile-audit
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: frontend-safe-audit-fix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  safe-fixes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply non-breaking npm security fixes
        run: npm audit fix --no-fund
        continue-on-error: true
      - name: Commit safe lockfile updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No non-breaking dependency updates available"
          else
            git commit -m "security: apply non-breaking frontend dependency updates"
            git push origin HEAD:${{ github.ref_name }}
          fi
