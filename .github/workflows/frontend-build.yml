name: Frontend build
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "fix/**", "feature/**"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Run regression tests
        run: npm test
      - name: Build Vite application
        run: npm run build
      - name: Smoke test built SPA routes and PWA assets
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort > /tmp/gom-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              break
            fi
            sleep 1
          done
          for route in / /admin /donate /account /login /donation-result /volunteer /power-of-revelation-ministries; do
            curl --fail --silent "http://127.0.0.1:4173$route" | grep -q '<div id="root"></div>'
          done
          for asset in /manifest.webmanifest /icons/icon-192.svg /icons/icon-512.svg /sw.js; do
            curl --fail --silent --output /dev/null "http://127.0.0.1:4173$asset"
          done
      - name: Audit dependency vulnerabilities
        run: npm audit --audit-level=high