name: Frontend build
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "fix/**", "feature/**"]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Run regression tests
        run: npm test
      - name: Build Vite application
        run: npm run build
      - name: Smoke test built SPA routes and PWA assets
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort > /tmp/gom-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              break
            fi
            sleep 1
          done
          for route in / /admin /donate /account /login /donation-result /volunteer /power-of-revelation-ministries; do
            curl --fail --silent "http://127.0.0.1:4173$route" | grep -q '<div id="root"></div>'
          done
          for asset in /manifest.webmanifest /icons/icon-192.svg /icons/icon-512.svg /sw.js; do
            curl --fail --silent --output /dev/null "http://127.0.0.1:4173$asset"
          done
      - name: Audit complete dependency tree (report only for build-time tooling)
        run: |
          npm audit --json > npm-audit.json || true
          node --input-type=commonjs <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('npm-audit.json', 'utf8'));
          console.log('FULL TREE VULNERABILITY COUNTS:', JSON.stringify(report.metadata?.vulnerabilities || {}));
          for (const [name, item] of Object.entries(report.vulnerabilities || {})) {
            console.log(JSON.stringify({
              package: name,
              severity: item.severity,
              direct: item.isDirect,
              range: item.range,
              fixAvailable: item.fixAvailable,
              via: item.via.map(v => typeof v === 'string' ? v : {
                title: v.title, url: v.url, range: v.range
              })
            }));
          }
          NODE
      - name: Enforce production dependency security
        run: npm audit --omit=dev --audit-level=high
      - name: Upload complete npm audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-npm-audit-report
          path: npm-audit.json
          if-no-files-found: ignore