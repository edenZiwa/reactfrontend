
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="theme-color" content="#176b45">

  <title>You're Offline | Garden of Mercy</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: #f4f8f5;
      color: #263b30;
      text-align: center;
    }

    main {
      max-width: 440px;
    }

    .icon {
      font-size: 55px;
      margin-bottom: 20px;
    }

    h1 {
      color: #176b45;
    }

    p {
      line-height: 1.7;
    }

    button {
      background: #176b45;
      color: white;
      border: 0;
      border-radius: 8px;
      padding: 13px 24px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <main>
    <div class="icon"><img src="/images/garden_of_mercy_logo.png"></div>

    <h1>You're currently offline</h1>

    <p>
      Garden of Mercy Foundation is temporarily
      unavailable because your internet connection
      has been interrupted.
    </p>

    <p>
      Please reconnect and try again.
    </p>

    <button onclick="location.reload()">
      Try Again
    </button>
  </main>
</body>
</html>
